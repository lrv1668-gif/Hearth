services:
    tasks:
        image: ghcr.io/lrv1668-gif/hearth-tasks:${HEARTH_VERSION:-latest}
        environment:
            - DB_PATH=/data/tasks.db
            - ASPNETCORE_HTTP_PORTS=8081
        volumes:
            - tasks-data:/data

    spotify:
        image: ghcr.io/lrv1668-gif/hearth-spotify:${HEARTH_VERSION:-latest}
        env_file:
            - ./spotify.env
        environment:
            - DB_PATH=/data/spotify.db
            - ASPNETCORE_HTTP_PORTS=8083
            - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
        volumes:
            - spotify-data:/data

    weather:
        image: ghcr.io/lrv1668-gif/hearth-weather:${HEARTH_VERSION:-latest}
        env_file:
            - ./weather.env
        environment:
            - DB_PATH=/data/weather.db
            - ASPNETCORE_HTTP_PORTS=8082
        volumes:
            - weather-data:/data

    photos:
        image: ghcr.io/lrv1668-gif/hearth-photos:${HEARTH_VERSION:-latest}
        env_file:
            - ./photos.env
        environment:
            - DATA_PATH=/data
            - ASPNETCORE_HTTP_PORTS=8084
        volumes:
            - photos-data:/data

    rss:
        image: ghcr.io/lrv1668-gif/hearth-rss:${HEARTH_VERSION:-latest}
        environment:
            - DB_PATH=/data/rss.db
            - ASPNETCORE_HTTP_PORTS=8085
        volumes:
            - rss-data:/data

    calendar:
        image: ghcr.io/lrv1668-gif/hearth-calendar:${HEARTH_VERSION:-latest}
        env_file:
            - ./calendar.env
        environment:
            - DB_PATH=/data/calendar.db
            - ASPNETCORE_HTTP_PORTS=8087
            - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
        volumes:
            - calendar-data:/data

    quote:
        image: ghcr.io/lrv1668-gif/hearth-quote:${HEARTH_VERSION:-latest}
        environment:
            - ASPNETCORE_HTTP_PORTS=8086

    birds:
        image: ghcr.io/lrv1668-gif/hearth-birds:${HEARTH_VERSION:-latest}
        env_file:
            - ./birds.env
        environment:
            - DB_PATH=/data/birds.db
            - ASPNETCORE_HTTP_PORTS=8088
        volumes:
            - birds-data:/data

    almanac:
        image: ghcr.io/lrv1668-gif/hearth-almanac:${HEARTH_VERSION:-latest}
        env_file:
            - ./almanac.env
        environment:
            - ASPNETCORE_HTTP_PORTS=8089

    frontend:
        image: ghcr.io/lrv1668-gif/hearth-frontend:${HEARTH_VERSION:-latest}
        depends_on:
            - tasks
            - spotify
            - weather
            - photos
            - rss
            - calendar
            - quote
            - birds
            - almanac

    caddy:
        image: caddy:2
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile
            - caddy-data:/data
        depends_on:
            - frontend
            - tasks
            - spotify
            - weather
            - photos
            - rss
            - calendar
            - quote
            - birds
            - almanac

volumes:
    tasks-data:
    spotify-data:
    weather-data:
    photos-data:
    rss-data:
    calendar-data:
    birds-data:
    caddy-data:
