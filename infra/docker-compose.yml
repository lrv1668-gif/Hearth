# Pinned so the project (and its volumes, hearth_<name>-data) doesn't take this
# folder's name; -p or COMPOSE_PROJECT_NAME still override it
name: hearth

# Shared defaults — merged into each service with `<<: *name`
x-defaults: &defaults
    restart: unless-stopped
    logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "3"

# Health check timing for the .NET services, whose chiseled images have no shell or
# curl: each one probes itself with `/app/service --health /<prefix>/health`
# (ServiceDefaults' HealthProbe). Degraded — e.g. an integration that isn't set up —
# still counts as healthy; Settings → Diagnostics has the detail.
x-probe: &probe
    interval: 60s
    timeout: 10s
    start_period: 30s
    start_interval: 2s

# Image names come from infra/.env (see .env.example). Locally they default to
# hearth-<service>:latest and `--build` builds them; a deployed host sets
# HEARTH_IMAGE_PREFIX to the registry CI pushes to and pulls instead (infra/deploy/update.sh).
services:
    tasks:
        <<: *defaults
        image: ${HEARTH_IMAGE_PREFIX:-hearth}-tasks:${HEARTH_TAG:-latest}
        healthcheck:
            <<: *probe
            test: ["CMD", "/app/service", "--health", "/tasks/health"]
        build:
            context: ../apps/services
            args:
                SERVICE: Tasks
        environment:
            - DB_PATH=/data/tasks.db
            - ASPNETCORE_HTTP_PORTS=8081
        volumes:
            - tasks-data:/data

    spotify:
        <<: *defaults
        image: ${HEARTH_IMAGE_PREFIX:-hearth}-spotify:${HEARTH_TAG:-latest}
        healthcheck:
            <<: *probe
            test: ["CMD", "/app/service", "--health", "/spotify/health"]
        build:
            context: ../apps/services
            args:
                SERVICE: Spotify
        env_file:
            - ../apps/services/Spotify/.env
        environment:
            - DB_PATH=/data/spotify.db
            - ASPNETCORE_HTTP_PORTS=8083
            - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
        volumes:
            - spotify-data:/data

    weather:
        <<: *defaults
        image: ${HEARTH_IMAGE_PREFIX:-hearth}-weather:${HEARTH_TAG:-latest}
        healthcheck:
            <<: *probe
            test: ["CMD", "/app/service", "--health", "/weather/health"]
        build:
            context: ../apps/services
            args:
                SERVICE: Weather
        env_file:
            - ../apps/services/Weather/.env
        environment:
            - DB_PATH=/data/weather.db
            - ASPNETCORE_HTTP_PORTS=8082
            # Home location and zone saved in Settings; .env values are the fallback
            - DISPLAY_URL=http://display:8090
        volumes:
            - weather-data:/data

    photos:
        <<: *defaults
        image: ${HEARTH_IMAGE_PREFIX:-hearth}-photos:${HEARTH_TAG:-latest}
        healthcheck:
            <<: *probe
            test: ["CMD", "/app/service", "--health", "/photos/health"]
        build:
            context: ../apps/services
            args:
                SERVICE: Photos
        env_file:
            - ../apps/services/Photos/.env
        environment:
            - DATA_PATH=/data
            - ASPNETCORE_HTTP_PORTS=8084
        volumes:
            - photos-data:/data

    rss:
        <<: *defaults
        image: ${HEARTH_IMAGE_PREFIX:-hearth}-rss:${HEARTH_TAG:-latest}
        healthcheck:
            <<: *probe
            test: ["CMD", "/app/service", "--health", "/rss/health"]
        build:
            context: ../apps/services
            args:
                SERVICE: Rss
        environment:
            - DB_PATH=/data/rss.db
            - ASPNETCORE_HTTP_PORTS=8085
        volumes:
            - rss-data:/data

    calendar:
        <<: *defaults
        image: ${HEARTH_IMAGE_PREFIX:-hearth}-calendar:${HEARTH_TAG:-latest}
        healthcheck:
            <<: *probe
            test: ["CMD", "/app/service", "--health", "/calendar/health"]
        build:
            context: ../apps/services
            args:
                SERVICE: Calendar
        env_file:
            - ../apps/services/Calendar/.env
        environment:
            - DB_PATH=/data/calendar.db
            - ASPNETCORE_HTTP_PORTS=8087
            - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
        volumes:
            - calendar-data:/data

    quote:
        <<: *defaults
        image: ${HEARTH_IMAGE_PREFIX:-hearth}-quote:${HEARTH_TAG:-latest}
        healthcheck:
            <<: *probe
            test: ["CMD", "/app/service", "--health", "/quote/health"]
        build:
            context: ../apps/services
            args:
                SERVICE: Quote
        environment:
            - ASPNETCORE_HTTP_PORTS=8086

    birds:
        <<: *defaults
        image: ${HEARTH_IMAGE_PREFIX:-hearth}-birds:${HEARTH_TAG:-latest}
        healthcheck:
            <<: *probe
            test: ["CMD", "/app/service", "--health", "/birds/health"]
        build:
            context: ../apps/services
            args:
                SERVICE: Birds
        env_file:
            - ../apps/services/Birds/.env
        environment:
            - DB_PATH=/data/birds.db
            - ASPNETCORE_HTTP_PORTS=8088
            # Home location and zone saved in Settings; .env values are the fallback
            - DISPLAY_URL=http://display:8090
        volumes:
            - birds-data:/data

    almanac:
        <<: *defaults
        image: ${HEARTH_IMAGE_PREFIX:-hearth}-almanac:${HEARTH_TAG:-latest}
        healthcheck:
            <<: *probe
            test: ["CMD", "/app/service", "--health", "/almanac/health"]
        build:
            context: ../apps/services
            args:
                SERVICE: Almanac
        env_file:
            - ../apps/services/Almanac/.env
        environment:
            - ASPNETCORE_HTTP_PORTS=8089
            # Home location and zone saved in Settings; .env values are the fallback
            - DISPLAY_URL=http://display:8090

    trains:
        <<: *defaults
        image: ${HEARTH_IMAGE_PREFIX:-hearth}-trains:${HEARTH_TAG:-latest}
        healthcheck:
            <<: *probe
            test: ["CMD", "/app/service", "--health", "/trains/health"]
        build:
            context: ../apps/services
            args:
                SERVICE: Trains
        env_file:
            - ../apps/services/Trains/.env
        environment:
            - DB_PATH=/data/trains.db
            - ASPNETCORE_HTTP_PORTS=8091
        volumes:
            - trains-data:/data

    sports:
        <<: *defaults
        image: ${HEARTH_IMAGE_PREFIX:-hearth}-sports:${HEARTH_TAG:-latest}
        healthcheck:
            <<: *probe
            test: ["CMD", "/app/service", "--health", "/sports/health"]
        build:
            context: ../apps/services
            args:
                SERVICE: Sports
        environment:
            - DB_PATH=/data/sports.db
            - ASPNETCORE_HTTP_PORTS=8094
        volumes:
            - sports-data:/data

    display:
        <<: *defaults
        image: ${HEARTH_IMAGE_PREFIX:-hearth}-display:${HEARTH_TAG:-latest}
        healthcheck:
            <<: *probe
            test: ["CMD", "/app/service", "--health", "/display/health"]
        build:
            context: ../apps/services
            args:
                SERVICE: Display
        environment:
            - DB_PATH=/data/display.db
            - ASPNETCORE_HTTP_PORTS=8090
            - RENDERER_URL=http://renderer:3000
            # Fallback zone for the mode schedule (infra/.env), matching the renderer's clock,
            # when none is saved in Settings → Home; UTC when neither is set
            - TZ=${TZ:-}
        volumes:
            - display-data:/data

    # Headless Chromium that screenshots /frame for the Display service to dither.
    # Internal only — no Caddy route. It loads the frame through Caddy's :80 site.
    renderer:
        <<: *defaults
        image: ${HEARTH_IMAGE_PREFIX:-hearth}-renderer:${HEARTH_TAG:-latest}
        build: ../apps/renderer
        init: true
        environment:
            - FRAME_BASE_URL=http://caddy
            # Fallback zone for the frame's date and clock (infra/.env) when none is saved in
            # Settings → Home; UTC when neither is set
            - TZ=${TZ:-}

    # Live logs for every container on the host at /logs (Dozzle), linked from Settings →
    # Diagnostics. Opt-in, since it reads the Docker socket: COMPOSE_PROFILES=logs in
    # infra/.env. Its login lives in infra/dozzle/users.yml — create it with
    # infra/deploy/dozzle-user.sh.
    # Nothing waits on it: without a login only /logs is down.
    dozzle:
        <<: *defaults
        profiles: [logs]
        image: amir20/dozzle:v11.3.5
        healthcheck:
            <<: *probe
            test: ["CMD", "/dozzle", "healthcheck"]
        environment:
            - DOZZLE_BASE=/logs
            - DOZZLE_AUTH_PROVIDER=simple
            - DOZZLE_AUTH_TTL=720h
            - DOZZLE_NO_ANALYTICS=true
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            # A folder, not users.yml itself: Docker would create a missing file as a directory
            - ./dozzle:/data

    frontend:
        <<: *defaults
        image: ${HEARTH_IMAGE_PREFIX:-hearth}-frontend:${HEARTH_TAG:-latest}
        build: ../apps/frontend
        # Node as PID 1 ignores SIGTERM; tini forwards it so `docker stop` is instant
        init: true
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
            interval: 60s
            timeout: 5s
            start_period: 30s
            start_interval: 2s
        depends_on:
            - tasks
            - spotify
            - weather
            - photos
            - rss
            - calendar
            - quote
            - birds
            - almanac
            - trains
            - sports
            - display

    caddy:
        <<: *defaults
        image: caddy:2.11
        environment:
            - HEARTH_HOST=${HEARTH_HOST:-localhost}
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config
        healthcheck:
            # Caddy's admin API (localhost-only inside the container)
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
            interval: 60s
            timeout: 5s
            start_period: 10s
            start_interval: 2s
        depends_on:
            frontend:
                condition: service_healthy
            tasks:
                condition: service_started
            spotify:
                condition: service_started
            weather:
                condition: service_started
            photos:
                condition: service_started
            rss:
                condition: service_started
            calendar:
                condition: service_started
            quote:
                condition: service_started
            birds:
                condition: service_started
            almanac:
                condition: service_started
            trains:
                condition: service_started
            display:
                condition: service_started

volumes:
    tasks-data:
    spotify-data:
    weather-data:
    photos-data:
    rss-data:
    calendar-data:
    birds-data:
    trains-data:
    sports-data:
    display-data:
    caddy-data:
    caddy-config:
