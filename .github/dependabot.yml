version: 2
updates:
  # Frontend npm packages
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      # Vite and vite-plugin-svelte have peer-dependency major versions locked
      # to each other (and to svelte/@sveltejs/kit) — bump them together so a
      # major-version PR for one never lands without its matching pair.
      vite-sveltekit-toolchain:
        patterns:
          - "vite"
          - "svelte"
          - "svelte-check"
          - "@sveltejs/*"
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 isn't yet supported by @sveltejs/kit's peer deps (even on
      # the unreleased v3 line, which still caps at ^6.0.0) — bumping breaks
      # `npm ci` with an ERESOLVE conflict. Revisit once SvelteKit allows it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # .NET NuGet packages — wildcards cover every service and test project;
  # /src and /tests themselves cover the central Directory.Packages.props files
  - package-ecosystem: "nuget"
    directories:
      - "/src"
      - "/src/*"
      - "/tests"
      - "/tests/*"
    schedule:
      interval: "weekly"
    groups:
      # SkiaSharp and its native-assets package are peer-locked to the same
      # major version — bump them together so one never lands without the
      # other. Listed before nuget-minor-patch so it claims major bumps too.
      skiasharp:
        patterns:
          - "SkiaSharp*"
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  # Docker base images
  - package-ecosystem: "docker"
    directories:
      - "/frontend"
      - "/src/*"
    schedule:
      interval: "weekly"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
