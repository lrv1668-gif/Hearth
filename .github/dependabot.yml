version: 2
updates:
  # Frontend npm packages
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 isn't yet supported by @sveltejs/kit's peer deps (even on
      # the unreleased v3 line, which still caps at ^6.0.0) — bumping breaks
      # `npm ci` with an ERESOLVE conflict. Revisit once SvelteKit allows it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # .NET NuGet packages — wildcards cover every service and test project
  - package-ecosystem: "nuget"
    directories:
      - "/src/*"
      - "/tests/*"
    schedule:
      interval: "weekly"
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  # Docker base images
  - package-ecosystem: "docker"
    directories:
      - "/frontend"
      - "/src/*"
    schedule:
      interval: "weekly"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
