name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
  # No paths-ignore here: a docs-only PR still runs, and the `changes` job skips
  # every stack, so required checks report as passed instead of staying pending
  pull_request:

jobs:
  # PRs only run the stacks they touch; pushes to main always run everything,
  # so every published image comes from a fully tested commit
  changes:
    name: Detect changed stacks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ github.event_name == 'push' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'push' || steps.filter.outputs.frontend == 'true' }}
      renderer: ${{ github.event_name == 'push' || steps.filter.outputs.renderer == 'true' }}
    steps:
      # On PRs the filter reads the changed files from the API, so no checkout
      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            workflow: &workflow
              - .github/workflows/ci.yml
            backend:
              - *workflow
              - apps/services/**
              - tests/**
              - Hearth.slnx
              - global.json
            frontend:
              - *workflow
              - apps/frontend/**
            renderer:
              - *workflow
              - apps/renderer/**

  backend-tests:
    name: Backend build & test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Hearth.slnx

      - name: Build
        run: dotnet build Hearth.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Hearth.slnx --no-build -c Release --verbosity normal

      - name: Check for vulnerable NuGet packages
        run: |
          output=$(dotnet list Hearth.slnx package --vulnerable --include-transitive 2>&1)
          echo "$output"
          if echo "$output" | grep -qi "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected — see output above"
            exit 1
          fi

  frontend-checks:
    name: Frontend build & typecheck
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # A normal run takes about a minute; a stalled npm registry call shouldn't hang for hours
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
        timeout-minutes: 3

  renderer-tests:
    name: Renderer dither tests
    needs: changes
    if: needs.changes.outputs.renderer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/renderer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/renderer/package-lock.json

      # Playwright's browsers come with the runtime image; the tests only dither
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Unit tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high
        timeout-minutes: 3

  publish-images:
    name: Publish ${{ matrix.service }} image
    # Only main, and only once the tests pass — a deployed host pulls :latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, frontend-checks, renderer-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # project = the apps/services/<Project> folder passed to the shared backend Dockerfile;
        # context = the folder of a standalone image (default: apps/frontend)
        include:
          - { service: tasks, project: Tasks }
          - { service: spotify, project: Spotify }
          - { service: weather, project: Weather }
          - { service: photos, project: Photos }
          - { service: rss, project: Rss }
          - { service: calendar, project: Calendar }
          - { service: quote, project: Quote }
          - { service: birds, project: Birds }
          - { service: almanac, project: Almanac }
          - { service: trains, project: Trains }
          - { service: sports, project: Sports }
          - { service: display, project: Display }
          - { service: frontend }
          - { service: renderer, context: apps/renderer }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The .NET images cross-publish natively; QEMU is only for the arm64 `npm ci`
      # steps of the frontend and renderer images (the renderer's installs node-canvas)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/hearth-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.project && 'apps/services' || matrix.context || 'apps/frontend' }}
          build-args: |
            SERVICE=${{ matrix.project }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
