name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Hearth.slnx

      - name: Build
        run: dotnet build Hearth.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Hearth.slnx --no-build -c Release --verbosity normal
