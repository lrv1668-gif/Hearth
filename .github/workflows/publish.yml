name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: tasks
            context: ./src
            dockerfile: Tasks/Dockerfile
          - service: spotify
            context: ./src
            dockerfile: Spotify/Dockerfile
          - service: weather
            context: ./src
            dockerfile: Weather/Dockerfile
          - service: photos
            context: ./src
            dockerfile: Photos/Dockerfile
          - service: rss
            context: ./src
            dockerfile: Rss/Dockerfile
          - service: calendar
            context: ./src
            dockerfile: Calendar/Dockerfile
          - service: quote
            context: ./src
            dockerfile: Quote/Dockerfile
          - service: birds
            context: ./src
            dockerfile: Birds/Dockerfile
          - service: almanac
            context: ./src
            dockerfile: Almanac/Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hearth-${{ matrix.service }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
