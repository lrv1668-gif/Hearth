services:
    tasks:
        build:
            context: ./src
            dockerfile: Tasks/Dockerfile
        environment:
            - DB_PATH=/data/tasks.db
            - ASPNETCORE_HTTP_PORTS=8081
        volumes:
            - tasks-data:/data

    spotify:
        build:
            context: ./src
            dockerfile: Spotify/Dockerfile
        env_file:
            - path: ./src/Spotify/.env
              required: false
        environment:
            - DB_PATH=/data/spotify.db
            - ASPNETCORE_HTTP_PORTS=8083
            - FRONTEND_URL=http://localhost
        volumes:
            - spotify-data:/data

    weather:
        build:
            context: ./src
            dockerfile: Weather/Dockerfile
        env_file:
            - path: ./src/Weather/.env
              required: false
        environment:
            - DB_PATH=/data/weather.db
            - ASPNETCORE_HTTP_PORTS=8082
        volumes:
            - weather-data:/data

    photos:
        build:
            context: ./src
            dockerfile: Photos/Dockerfile
        env_file:
            - path: ./src/Photos/.env
              required: false
        environment:
            - DATA_PATH=/data
            - ASPNETCORE_HTTP_PORTS=8084
        volumes:
            - photos-data:/data

    rss:
        build:
            context: ./src
            dockerfile: Rss/Dockerfile
        environment:
            - DB_PATH=/data/rss.db
            - ASPNETCORE_HTTP_PORTS=8085
        volumes:
            - rss-data:/data

    calendar:
        build:
            context: ./src
            dockerfile: Calendar/Dockerfile
        env_file:
            - path: ./src/Calendar/.env
              required: false
        environment:
            - DB_PATH=/data/calendar.db
            - ASPNETCORE_HTTP_PORTS=8087
            - FRONTEND_URL=http://localhost
        volumes:
            - calendar-data:/data

    quote:
        build:
            context: ./src
            dockerfile: Quote/Dockerfile
        environment:
            - ASPNETCORE_HTTP_PORTS=8086

    birds:
        build:
            context: ./src
            dockerfile: Birds/Dockerfile
        env_file:
            - path: ./src/Birds/.env
              required: false
        environment:
            - DB_PATH=/data/birds.db
            - ASPNETCORE_HTTP_PORTS=8088
        volumes:
            - birds-data:/data

    frontend:
        build: ./frontend
        depends_on:
            - tasks
            - spotify
            - weather
            - photos
            - rss
            - calendar
            - quote
            - birds

    caddy:
        image: caddy:2
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile
            - caddy-data:/data
        depends_on:
            - frontend
            - tasks
            - spotify
            - weather
            - photos
            - rss
            - calendar
            - quote
            - birds

volumes:
    tasks-data:
    spotify-data:
    weather-data:
    photos-data:
    rss-data:
    calendar-data:
    birds-data:
    caddy-data:
