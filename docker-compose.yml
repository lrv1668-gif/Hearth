# Shared defaults — merged into each service with `<<: *name`
x-defaults: &defaults
    restart: unless-stopped
    logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "3"

services:
    tasks:
        <<: *defaults
        build:
            context: ./src
            args:
                SERVICE: Tasks
        environment:
            - DB_PATH=/data/tasks.db
            - ASPNETCORE_HTTP_PORTS=8081
        volumes:
            - tasks-data:/data

    spotify:
        <<: *defaults
        build:
            context: ./src
            args:
                SERVICE: Spotify
        env_file:
            - ./src/Spotify/.env
        environment:
            - DB_PATH=/data/spotify.db
            - ASPNETCORE_HTTP_PORTS=8083
            - FRONTEND_URL=http://localhost
        volumes:
            - spotify-data:/data

    weather:
        <<: *defaults
        build:
            context: ./src
            args:
                SERVICE: Weather
        env_file:
            - ./src/Weather/.env
        environment:
            - DB_PATH=/data/weather.db
            - ASPNETCORE_HTTP_PORTS=8082
        volumes:
            - weather-data:/data

    photos:
        <<: *defaults
        build:
            context: ./src
            args:
                SERVICE: Photos
        env_file:
            - ./src/Photos/.env
        environment:
            - DATA_PATH=/data
            - ASPNETCORE_HTTP_PORTS=8084
        volumes:
            - photos-data:/data

    rss:
        <<: *defaults
        build:
            context: ./src
            args:
                SERVICE: Rss
        environment:
            - DB_PATH=/data/rss.db
            - ASPNETCORE_HTTP_PORTS=8085
        volumes:
            - rss-data:/data

    calendar:
        <<: *defaults
        build:
            context: ./src
            args:
                SERVICE: Calendar
        env_file:
            - ./src/Calendar/.env
        environment:
            - DB_PATH=/data/calendar.db
            - ASPNETCORE_HTTP_PORTS=8087
            - FRONTEND_URL=http://localhost
        volumes:
            - calendar-data:/data

    quote:
        <<: *defaults
        build:
            context: ./src
            args:
                SERVICE: Quote
        environment:
            - ASPNETCORE_HTTP_PORTS=8086

    birds:
        <<: *defaults
        build:
            context: ./src
            args:
                SERVICE: Birds
        env_file:
            - ./src/Birds/.env
        environment:
            - DB_PATH=/data/birds.db
            - ASPNETCORE_HTTP_PORTS=8088
        volumes:
            - birds-data:/data

    almanac:
        <<: *defaults
        build:
            context: ./src
            args:
                SERVICE: Almanac
        env_file:
            - ./src/Almanac/.env
        environment:
            - ASPNETCORE_HTTP_PORTS=8089

    trains:
        <<: *defaults
        build:
            context: ./src
            args:
                SERVICE: Trains
        env_file:
            - ./src/Trains/.env
        environment:
            - DB_PATH=/data/trains.db
            - ASPNETCORE_HTTP_PORTS=8091
        volumes:
            - trains-data:/data

    frontend:
        <<: *defaults
        build: ./frontend
        # Node as PID 1 ignores SIGTERM; tini forwards it so `docker stop` is instant
        init: true
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
            interval: 60s
            timeout: 5s
            start_period: 30s
            start_interval: 2s
        depends_on:
            - tasks
            - spotify
            - weather
            - photos
            - rss
            - calendar
            - quote
            - birds
            - almanac
            - trains

    caddy:
        <<: *defaults
        image: caddy:2.11
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config
        healthcheck:
            # Caddy's admin API (localhost-only inside the container)
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
            interval: 60s
            timeout: 5s
            start_period: 10s
            start_interval: 2s
        depends_on:
            frontend:
                condition: service_healthy
            tasks:
                condition: service_started
            spotify:
                condition: service_started
            weather:
                condition: service_started
            photos:
                condition: service_started
            rss:
                condition: service_started
            calendar:
                condition: service_started
            quote:
                condition: service_started
            birds:
                condition: service_started
            almanac:
                condition: service_started
            trains:
                condition: service_started

volumes:
    tasks-data:
    spotify-data:
    weather-data:
    photos-data:
    rss-data:
    calendar-data:
    birds-data:
    trains-data:
    caddy-data:
    caddy-config:
