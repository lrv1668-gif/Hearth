services:
    tasks:
        build:
            context: ./services
            dockerfile: Tasks/Dockerfile
        environment:
            - DB_PATH=/data/tasks.db
            - ASPNETCORE_HTTP_PORTS=8081
        volumes:
            - tasks-data:/data

    spotify:
        build:
            context: ./services
            dockerfile: Spotify/Dockerfile
        env_file:
            - ./services/Spotify/.env
        environment:
            - DB_PATH=/data/spotify.db
            - ASPNETCORE_HTTP_PORTS=8083
            - FRONTEND_URL=http://localhost
        volumes:
            - spotify-data:/data

    weather:
        build:
            context: ./services
            dockerfile: Weather/Dockerfile
        env_file:
            - ./services/Weather/.env
        environment:
            - DB_PATH=/data/weather.db
            - ASPNETCORE_HTTP_PORTS=8082
        volumes:
            - weather-data:/data

    photos:
        build:
            context: ./services
            dockerfile: Photos/Dockerfile
        env_file:
            - ./services/Photos/.env
        environment:
            - DB_PATH=/data/photos.db
            - ASPNETCORE_HTTP_PORTS=8084
        volumes:
            - photos-data:/data

    frontend:
        build: ./frontend
        depends_on:
            - tasks
            - spotify
            - weather
            - photos

    caddy:
        image: caddy:2
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile
            - caddy-data:/data
        depends_on:
            - frontend
            - tasks
            - spotify
            - weather
            - photos

volumes:
    tasks-data:
    spotify-data:
    weather-data:
    photos-data:
    caddy-data:
