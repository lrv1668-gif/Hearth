services:
  tasks:
    ports:
      - "127.0.0.1:8081:8081"

  spotify:
    ports:
      - "127.0.0.1:8083:8083"

  weather:
    ports:
      - "127.0.0.1:8082:8082"

  photos:
    ports:
      - "127.0.0.1:8084:8084"

  rss:
    ports:
      - "127.0.0.1:8085:8085"

  calendar:
    ports:
      - "127.0.0.1:8087:8087"

  quote:
    ports:
      - "127.0.0.1:8086:8086"

  birds:
    ports:
      - "127.0.0.1:8088:8088"

  almanac:
    ports:
      - "127.0.0.1:8089:8089"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      - TASKS_URL=http://tasks:8081
      - SPOTIFY_URL=http://spotify:8083
      - WEATHER_URL=http://weather:8082
      - PHOTOS_URL=http://photos:8084
      - RSS_URL=http://rss:8085
      - CALENDAR_URL=http://calendar:8087
      - QUOTE_URL=http://quote:8086
      - BIRDS_URL=http://birds:8088
      - ALMANAC_URL=http://almanac:8089
      - HMR_CLIENT_PORT=80
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/static
          target: /app/static
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/svelte.config.js
        - action: rebuild
          path: ./frontend/vite.config.ts
